# Publica o app no GitHub Pages a cada push na branch main.
# Se as variáveis SUPABASE_URL e SUPABASE_ANON_KEY existirem no repositório
# (Settings → Secrets and variables → Actions → Variables), elas substituem assets/config.js.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testar regras de negócio e leitura da base
        run: node --test scripts/base.test.mjs scripts/gsheets.test.mjs scripts/sharepoint.test.mjs

      - name: Montar site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest assets _site/
          # Limpa o que costuma vir colado junto: espaços, quebras de linha e o "/rest/v1/" do fim da URL
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed -E 's#/rest/v1/?$##; s#/+$##')
          KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            cat > _site/assets/config.js <<JS
          export const CONFIG = {
            supabaseUrl: '${URL}',
            supabaseAnonKey: '${KEY}',
            dominiosEmail: ['beedelivery.com.br'],
          };
          JS
            echo "config.js gerado a partir das variáveis do repositório (URL: ${URL})"
          else
            echo "::warning::Variáveis SUPABASE_URL e SUPABASE_ANON_KEY não definidas: o site vai pedir para configurar o Supabase."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
